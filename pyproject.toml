[project]
name = "wiborada"
version = "0.2.0"
description = "Personal library manager with shelves, tags, digital ebooks, ISBN lookup, and AI recommendations"
authors = [{name = "Weston Matthews"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic"]
images = ["Pillow"]

[tool.poetry]
packages = [{include = "wiborada", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
